<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Study Quest - Difficulty</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;

            color: white;

            background:
                radial-gradient(circle at 10% 10%, #263b91 0%, transparent 32%),
                radial-gradient(circle at 90% 90%, #531d78 0%, transparent 32%),
                #080d20;
        }

        .container {
            width: 100%;
            max-width: 850px;
            text-align: center;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 45px;
        }

        .logo span {
            color: #8b6cff;
        }

        .badge {
            display: inline-block;
            padding: 7px 14px;
            border-radius: 20px;

            background: rgba(124, 92, 255, 0.15);
            border: 1px solid #51448d;

            color: #bdb3ff;
            font-size: 13px;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 40px;
            margin-bottom: 10px;
        }

        h1 span {
            background: linear-gradient(90deg, #8b6cff, #dc5cff);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: #9099b5;
            font-size: 15px;
            margin-bottom: 40px;
        }

        .difficulty-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 22px;
        }

        .difficulty-form {
            margin: 0;
        }

        .difficulty-card {
            width: 100%;
            min-height: 270px;

            padding: 30px 20px;

            border-radius: 22px;
            border: 1px solid #303958;

            background: rgba(20, 27, 53, 0.94);
            color: white;

            cursor: pointer;
            transition: 0.25s;
        }

        .difficulty-card:hover {
            transform: translateY(-8px);
        }

        .icon {
            width: 72px;
            height: 72px;

            margin: 0 auto 18px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 20px;

            font-size: 34px;
        }

        .easy .icon {
            background: rgba(34, 197, 94, 0.14);
        }

        .medium .icon {
            background: rgba(234, 179, 8, 0.14);
        }

        .hard .icon {
            background: rgba(239, 68, 68, 0.14);
        }

        .difficulty-card h2 {
            font-size: 22px;
            margin-bottom: 10px;
        }

        .difficulty-card p {
            color: #8993b0;
            font-size: 13px;
            line-height: 1.5;
            min-height: 40px;
        }

        .select-btn {
            display: inline-block;

            margin-top: 20px;

            padding: 10px 18px;

            border-radius: 10px;

            font-size: 13px;
            font-weight: bold;
        }

        .easy {
            border-color: rgba(34, 197, 94, 0.25);
        }

        .easy:hover {
            border-color: #22c55e;
            box-shadow: 0 15px 35px rgba(34, 197, 94, 0.15);
        }

        .easy .select-btn {
            background: rgba(34, 197, 94, 0.13);
            color: #4ade80;
        }

        .medium {
            border-color: rgba(234, 179, 8, 0.25);
        }

        .medium:hover {
            border-color: #eab308;
            box-shadow: 0 15px 35px rgba(234, 179, 8, 0.15);
        }

        .medium .select-btn {
            background: rgba(234, 179, 8, 0.13);
            color: #facc15;
        }

        .hard {
            border-color: rgba(239, 68, 68, 0.25);
        }

        .hard:hover {
            border-color: #ef4444;
            box-shadow: 0 15px 35px rgba(239, 68, 68, 0.15);
        }

        .hard .select-btn {
            background: rgba(239, 68, 68, 0.13);
            color: #f87171;
        }

        .back {
            display: inline-block;

            margin-top: 35px;

            color: #8d96b2;
            text-decoration: none;

            font-size: 14px;
        }

        .back:hover {
            color: white;
        }

        @media (max-width: 700px) {

            body {
                padding: 20px 15px;
            }

            h1 {
                font-size: 31px;
            }

            .difficulty-grid {
                grid-template-columns: 1fr;
                max-width: 400px;
                margin: auto;
            }

            .difficulty-card {
                min-height: 220px;
            }

            .logo {
                margin-bottom: 30px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">
        🎮 AI <span>Study Quest</span>
    </div>

    <div class="badge">
        🎯 Subject Selected: {{ subject }}
    </div>

    <h1>
        Choose Your <span>Difficulty</span>
    </h1>

    <p class="subtitle">
        Challenge yourself and test your knowledge 🚀
    </p>


    <div class="difficulty-grid">


        <!-- EASY -->
        <form class="difficulty-form"
              action="/start_quiz"
              method="POST">

            <input type="hidden"
                   name="subject"
                   value="{{ subject }}">

            <input type="hidden"
                   name="difficulty"
                   value="Easy">

            <button type="submit"
                    class="difficulty-card easy">

                <div class="icon">
                    🟢
                </div>

                <h2>Easy</h2>

                <p>
                    Perfect for beginners.
                    Test your basic concepts.
                </p>

                <span class="select-btn">
                    Start Easy →
                </span>

            </button>

        </form>


        <!-- MEDIUM -->
        <form class="difficulty-form"
              action="/start_quiz"
              method="POST">

            <input type="hidden"
                   name="subject"
                   value="{{ subject }}">

            <input type="hidden"
                   name="difficulty"
                   value="Medium">

            <button type="submit"
                    class="difficulty-card medium">

                <div class="icon">
                    🟡
                </div>

                <h2>Medium</h2>

                <p>
                    Test your understanding
                    with moderate challenges.
                </p>

                <span class="select-btn">
                    Start Medium →
                </span>

            </button>

        </form>


        <!-- HARD -->
        <form class="difficulty-form"
              action="/start_quiz"
              method="POST">

            <input type="hidden"
                   name="subject"
                   value="{{ subject }}">

            <input type="hidden"
                   name="difficulty"
                   value="Hard">

            <button type="submit"
                    class="difficulty-card hard">

                <div class="icon">
                    🔴
                </div>

                <h2>Hard</h2>

                <p>
                    For advanced learners.
                    Take the ultimate challenge.
                </p>

                <span class="select-btn">
                    Start Hard →
                </span>

            </button>

        </form>

    </div>


    <a href="/subjects" class="back">
        ← Choose another subject
    </a>

</div>

</body>
</html>
