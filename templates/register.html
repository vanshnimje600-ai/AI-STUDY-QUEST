<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Study Quest - Register</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            padding: 20px;
        }

        .register-card {
            width: 100%;
            max-width: 430px;
            background: rgba(255, 255, 255, 0.96);
            padding: 35px;
            border-radius: 22px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.20);
            text-align: center;
        }

        .logo {
            font-size: 48px;
            margin-bottom: 8px;
        }

        h1 {
            color: #172554;
            font-size: 30px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .input-group {
            text-align: left;
            margin-bottom: 17px;
        }

        .input-group label {
            display: block;
            margin-bottom: 7px;
            color: #334155;
            font-weight: bold;
            font-size: 14px;
        }

        .input-group input {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #cbd5e1;
            border-radius: 11px;
            outline: none;
            font-size: 15px;
            transition: 0.2s;
        }

        .input-group input:focus {
            border-color: #2196f3;
            box-shadow: 0 0 0 3px rgba(33, 150, 243, 0.12);
        }

        .register-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(90deg, #2196f3, #00bcd4);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
            transition: 0.25s;
        }

        .register-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(33, 150, 243, 0.30);
        }

        .login-text {
            margin-top: 22px;
            color: #64748b;
            font-size: 14px;
        }

        .login-text a {
            color: #1976d2;
            font-weight: bold;
            text-decoration: none;
        }

        .login-text a:hover {
            text-decoration: underline;
        }

        .features {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-around;
            font-size: 12px;
            color: #64748b;
        }

        .feature {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .feature span {
            font-size: 20px;
        }

        @media (max-width: 480px) {
            .register-card {
                padding: 28px 22px;
            }

            h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

    <div class="register-card">

        <div class="logo">🎮</div>

        <h1>Join AI Study Quest</h1>

        <p class="subtitle">
            Create your account and start your learning adventure 🚀
        </p>

        <form method="POST" action="/register">

            <div class="input-group">
                <label>👤 Username</label>
                <input
                    type="text"
                    name="username"
                    placeholder="Enter your username"
                    required
                >
            </div>

            <div class="input-group">
                <label>📧 Email</label>
                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="input-group">
                <label>🔒 Password</label>
                <input
                    type="password"
                    name="password"
                    placeholder="Create a password"
                    required
                >
            </div>

            <button type="submit" class="register-btn">
                Create Account 🚀
            </button>

        </form>

        <p class="login-text">
            Already have an account?
            <a href="/">Login</a>
        </p>

        <div class="features">
            <div class="feature">
                <span>🤖</span>
                AI Quizzes
            </div>

            <div class="feature">
                <span>🏆</span>
                Leaderboard
            </div>

            <div class="feature">
                <span>📊</span>
                Track Progress
            </div>
        </div>

    </div>

</body>
</html>
